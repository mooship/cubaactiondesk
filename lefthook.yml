pre-commit:
  jobs:
    - name: format
      glob: "*.{ts,mjs,js,json,jsonc,css,astro,yml,yaml}"
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{ts,mjs,js,astro,css,json,jsonc,md}"
      run: npm run lint:ensure --silent && npm exec --prefix tools/lint -- eslint --fix --no-warn-ignored --max-warnings 0 {staged_files}
      stage_fixed: true
