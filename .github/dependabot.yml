version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # The ESLint tools are a separate package. typescript-eslint needs TypeScript 6's JavaScript API, which
  # TypeScript 7 does not have, so TypeScript stays on 6.x here while the site uses 7.
  - package-ecosystem: npm
    directory: /tools/lint
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      lint:
        applies-to: version-updates
        patterns: ["*"]
      lint-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(lint)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
