onlinePayment: card
paymentNotes: "Checked 2026-10-29 without paying. The appeal page is on CanadaHelps (a registered Canadian charity acting as processor) and shows Donate Now, Donate Monthly and Donate Securities with amounts of $75, $150, $200 or another amount, then a Continue to Complete Donation button. The card fields are on the next step, which was not opened because that button submits a form. CanadaHelps help pages (read the same day) say it accepts Visa, Visa Debit, Mastercard, American Express, PayPal, Google Pay and Apple Pay, not EFTs or cheques; that donors outside Canada can give; that all gifts are processed in Canadian dollars, so the card is charged in CAD and the card issuer converts it; and that it issues Canadian tax receipts only (check whether a Canadian receipt is usable in South Africa). The Red Cross's own pages loaded in a real browser after a short wait but the donation itself is made on CanadaHelps."
payNote: "You pay through CanadaHelps, a Canadian charity that processes the gift. Your card is charged in Canadian dollars, and the tax receipt is a Canadian one."
