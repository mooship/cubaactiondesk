delivers: Funds Red Cross relief supplies, humanitarian experts and recovery work for people in Cuba affected by fuel shortages, power cuts and Hurricane Melissa.
howMoneyReaches: "The Canadian Red Cross says funds support the Red Cross to deliver relief, aid recovery and build resilience, working with its local partner the Cuban Red Cross. It does not say how an individual gift is routed or which share goes to Cuba."
recipientsInCuba: "Families and communities affected by the crisis, served through the Cuban Red Cross (relief items, medical services, psychosocial support); health centres, nursing homes and schools are named as affected."
# Earliest dated Canadian Red Cross page found about its Cuba work (blog post dated 2017-10-26 on a team visit to the Havana branch of the Cuban Red Cross after Hurricane Irma, saying support would continue). The Red Cross fact sheet says only "a long history of working with our partners in the Americas, including the Cuban Red Cross". This is not a founding date.
