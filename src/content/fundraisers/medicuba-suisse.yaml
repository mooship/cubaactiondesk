delivers: Funds public health projects in Cuba (surgery, paediatrics, geriatrics, training) and sends containers of donated medical material, working with Cuban hospitals and the Ministry of Public Health. It is a Swiss NGO and is separate from MEDICUBA S.A., the Cuban state import company.
howMoneyReaches: "Its 2025 annual report lists spending per project (for example CHF 471,385 on the Matanzas hospital programme) and says six containers sent in 2025 were forwarded to Matanzas by the Cuban NGO Quisicuaba, plus one container for an Artemisa nursing home organised with the Cuban embassy in Bern. The report does not describe the bank route for money paid to Cuban partners. It says it bases its work on the Cuban Ministry of Health's priorities and the initiative of partner institutions."
recipientsInCuba: "Named hospitals in the 2025 annual report: Faustino Pérez provincial hospital and the Eliseo Noel Camaño paediatric hospital in Matanzas, Hermanos Ameijeiras hospital in Havana (neurosurgery), the Ciego de Ávila hospital surgical department, and the Fidel Labrador García nursing home in Artemisa."
