paymentNotes: "Online donation form is hosted on secure.qgiv.com; other routes are Zelle and cheque to a New York PO box, which are impractical from South Africa. IFCO's pages ask donors not to write 'Cuba' in payment memos or comments (the donate page says such payments are subject to screening) and suggest 'Humanitarian Aid' instead. Pages say gifts are tax-deductible under US law. No statement about currencies or international donors was found."
