delivers: Works in Cuba through Caritas Cuba, the Catholic Church's aid network. After Hurricane Melissa (landfall 2025-10-28) CRS and Caritas Cuba gave food kits, hygiene supplies, water treatment materials and solar lanterns. CRS says it has delivered more than 32 million dollars of medical and emergency supplies in Cuba since 1993.
howMoneyReaches: "CRS says it works in partnership with Caritas Cuba and local Church partners (dioceses, Caritas teams, parish networks) and that it provided shelter materials, food, hygiene supplies and cash support after the hurricane. Its pages do not describe the banking route into Cuba. Its Cuba page says Caritas Cuba does not have official legal recognition but is accepted by the Cuban government. The gift form says contributions will be used for the purpose specified by the donor, but that CRS may use them for its general purposes if it judges that purpose unnecessary, undesirable, impractical or impossible."
recipientsInCuba: "Caritas Cuba and its diocesan members (programmes in all 11 dioceses and nationally in Havana) deliver to vulnerable households: older adults, people with disabilities and families with small children are named. CRS's Cuba page says 6,000 households have received food kits and about 20,000 are expected; its 2026-07-21 release says the Hurricane Melissa response focuses on four dioceses in eastern Cuba."
activeSince: 1993-01-01
