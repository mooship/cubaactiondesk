onlinePayment: card
paymentNotes: "Checked 2026-10-29 in a browser without paying. The old URL crs.org/help/cuba-emergency now returns 404. CRS has no Cuba-only donation page: the Donate to Emergency Relief button on its Cuba page leads to a general emergency fund page that does not mention Cuba. The nearest real page is the Hurricane Melissa appeal, https://www.crs.org/donate/hurricane-melissa, headed Help Families in Cuba, Haiti and Jamaica, so a gift is not Cuba-only and CRS may reallocate it. That page has amounts from 50 to 1,000 dollars (USD), a Pay with Card section with card number, expiry and security code fields (VGS secure fields, Stripe), PayPal and Google Pay, plus phone and mail options. The page says donations are tax-deductible to the full extent allowable under the law (US 501(c)(3)). Funding note: CRS's own 2026-07-21 release says its expanded Cuba response is funded by a 60 million dollar US State Department award, and earlier third-party reports said the 2026 container and airlift deliveries were US government funded, so those deliveries do not show what a private gift does. CRS's Cuba page does not say how much of the Melissa response came from private donations."
