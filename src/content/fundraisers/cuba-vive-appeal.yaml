onlinePayment: card
paymentNotes: "Checked 2026-10-29 without paying. The Donate Here button opens the Cuba Vive Medical Aid Appeal page on shop.cuba-solidarity.org.uk with fixed amounts of 10, 25, 50, 100, 250 and 500 pounds (the page says to call or email for another amount or a BACS transfer). Choosing an amount adds it to a shopping cart (the cart form posts to ww10.aitsafe.com); the cart and the card fields were not opened. The shop's own Ordering page says you pay by credit or debit card (most major cards, not American Express), that CSC currently uses Nochex Ltd to process online card payments, that all transactions are in UK sterling, and that memberships and donations from outside the UK are welcome. Other routes on the Cuba Vive page: cheque payable to CSC (Cuba Vive), card by phone, BACS by email request. CSC is not on the Charity Commission register and no company of that name was found on Companies House, so UK charity tax relief is unlikely."
approved: false
