id: cuba-vive-appeal
name: Cuba Vive medical aid appeal (Cuba Solidarity Campaign, UK)
country: United Kingdom
category: solidarity
website: https://cubavive.org.uk/
donateUrl: https://cubavive.org.uk/donate/
registration: null
delivers: Buys medical supplies and equipment (and, since 2026, emergency food) in the UK and abroad and ships them to Cuba in containers and flights.
howMoneyReaches: "Funds buy supplies, which are shipped to Cuba. The Cuba Solidarity Campaign (CSC) says it works with the UK charity Jacob's Well Appeal for sorting, storage, packing and shipping, and that MEDICUBA, part of Cuba's Ministry of Public Health, oversees distribution of donations in Cuba. MEDICUBA's own site describes MEDICuba S.A. as the Cuban state company that clears (nationalises) donated goods for the health system, with the Ministry of Public Health and the Foreign Ministry authorising each donation."
recipientsInCuba: "Cuban hospitals and polyclinics, supplied as requested by the Cuban health workers' union (SNTS) and the Ministry of Health; the food appeal reaches families."
activeSince: 2024-01-01
