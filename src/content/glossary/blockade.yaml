term: "Blockade"
definition: "The word that Cuba and its supporters, including South Africa, use for the US embargo. The US government rejects the term. In the UN General Assembly debate in October 2026 its UN ambassador said, 'There is no blockade.' US policy documents call it an economic embargo."
sources: [un-news-cuba-embargo-vote-2026, nspm-5-2025, dirco-lamola-unga81-2026]
