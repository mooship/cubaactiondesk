term: "Extraterritorial sanctions"
definition: "Sanctions a country applies beyond its own borders, to people and firms in other countries. They are also called secondary sanctions. US rules on Cuba can reach non-US banks. South Africa says this makes trading with Cuba riskier."
sources: [eo-14404-2026, ofac-alert-cuba-2026-09, un-sg-report-a-80-83]
