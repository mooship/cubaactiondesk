term: "Helms-Burton Act"
definition: "A 1996 US law, officially the LIBERTAD Act. It wrote the Cuba embargo into US law. Title III lets US nationals sue people who 'traffic' in property Cuba confiscated. Title IV bars such people from entering the US."
sources: [crs-r43888-cuba-sanctions, havana-docks-v-msc-order-2020]
